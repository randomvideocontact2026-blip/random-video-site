<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Video Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="ageGate" class="age-gate">
    <div class="age-gate-content">
      <p class="age-gate-site-name">RANDOM VIDEO</p>

      <h1>年齢確認</h1>

      <p>
        このサイトは成人向け作品を取り扱う予定です。
      </p>

      <p>
        18歳未満の方はご利用いただけません。
      </p>

      <div class="age-gate-buttons">
        <button id="ageConfirmButton" type="button">
          18歳以上です
        </button>

        <a href="https://www.google.com/">
          18歳未満です
        </a>
      </div>
    </div>
  </div>

  <main id="mainContent" class="container" hidden>
    <header>
      <p class="site-name">RANDOM VIDEO</p>
      <h1>本日のランダム作品</h1>
    </header>

    <section class="site-introduction">
  <p>
    条件を選択して、作品をランダムに探せるサイトです。
  </p>

  <p class="sample-notice">
    現在表示している作品情報は、サイト制作中のサンプルデータです。
  </p>
</section>

    <div class="genre-filter">
  <label for="genreSelect">表示するジャンル：</label>

  <select id="genreSelect">
    <option value="all">すべて</option>
  </select>
</div>

 <div class="price-filter">
  <label for="priceSelect">価格帯：</label>

  <select id="priceSelect">
    <option value="all">すべて</option>
    <option value="under1000">1,000円未満</option>
    <option value="1000to1999">1,000円〜1,999円</option>
    <option value="2000plus">2,000円以上</option>
  </select>
</div>

<p id="resultCount"></p>

<button id="resetButton" type="button">条件をリセット</button>

    <section class="product">
      <img
  id="productImage"
  src="https://placehold.co/1280x720?text=Random+Video"
  alt="作品画像"
>
      <p id="title">ボタンを押すと作品が表示されます。</p>
      <p id="price"></p>
      <p id="genre"></p>
      <p id="message"></p>

      <div class="buttons">
        <button id="randomButton">別の作品を見る</button>

        <a id="productLink" href="#" target="_blank" hidden>
          商品ページへ
        </a>
      </div>
    </section>

        <footer class="site-footer">
      <nav class="footer-links">
        <a href="about.html">運営者情報</a>
        <a href="privacy.html">プライバシーポリシー</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>

      <p class="affiliate-notice">
        当サイトはアフィリエイト広告を利用する予定です。
      </p>

      <p class="copyright">
        &copy; 2026 RANDOM VIDEO
      </p>
    </footer>

  </main>

  <script src="items.js"></script>
  <script src="script.js"></script>
</body>
</html>
